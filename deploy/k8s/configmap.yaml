apiVersion: v1
kind: ConfigMap
metadata:
  name: stellaredupay
data:
  # ── Runtime environment ──────────────────────────────────────────────────
  NODE_ENV: "production"
  PORT: "5000"

  # ── Stellar / blockchain ─────────────────────────────────────────────────
  # Overridden per-overlay (testnet sets this to "testnet").
  STELLAR_NETWORK: "mainnet"

  # ── Redis ────────────────────────────────────────────────────────────────
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  # Authentication is mandatory: the password is injected from the
  # `stellaredupay-secrets` Secret (key REDIS_PASSWORD) via secretKeyRef in
  # redis.yaml and backend-deployment.yaml. Never put it in this ConfigMap.
  # The server-side settings (maxmemory, maxmemory-policy, appendonly) live in
  # the dedicated `redis-config` ConfigMap below and are mounted as redis.conf.

  # ── Background jobs ──────────────────────────────────────────────────────
  POLL_INTERVAL_MS: "30000"
  RETRY_INTERVAL_MS: "60000"
  RETRY_MAX_ATTEMPTS: "10"

  # ── Server ───────────────────────────────────────────────────────────────
  # SHUTDOWN_TIMEOUT_MS: keep in sync with terminationGracePeriodSeconds in
  # backend-deployment.yaml (grace period = SHUTDOWN_TIMEOUT_MS + ~10 s margin).
  SHUTDOWN_TIMEOUT_MS: "35000"
  LOG_LEVEL: "info"
  MAX_BODY_SIZE: "1mb"

  # ── Security / rate limiting ──────────────────────────────────────────────
  TRUSTED_PROXY_HOPS: "1"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  VERIFY_RATE_LIMIT: "10"

  # ── Webhook ───────────────────────────────────────────────────────────────
  # Date after which the deprecated V1 webhook signature is never sent (#1539).
  WEBHOOK_V1_SUNSET: "2027-02-28"

  # ── Frontend proxy (Next.js SSR rewrites) ─────────────────────────────────
  BACKEND_PROXY_TARGET: "http://backend:5000"

  # ── Public base URL ───────────────────────────────────────────────────────
  # Required in production. Used for unsubscribe links and emails.
  # Must be overridden in your overlay or via a patch.
  APP_URL: "https://stellaredupay.example.com"
---
# Single source of truth for the public Ingress host (issue #2005).
# Kustomize `replacements` (see kustomization.yaml) copy INGRESS_HOST into both
# spec.tls[0].hosts and spec.rules[0].host of the Ingress, so the TLS
# certificate and the routing rule can never disagree. Override this value in
# an overlay to deploy a different domain.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stellaredupay-ingress-host
data:
  INGRESS_HOST: "stellaredupay.example.com"
---
# Redis server configuration, mounted at /usr/local/etc/redis/redis.conf and
# passed to `redis-server` as its config file.
#
# - `maxmemory-policy noeviction` is required by BullMQ: with any eviction
#   policy, job keys can silently disappear. With noeviction, writes fail with
#   OOM errors once maxmemory is reached instead of losing queue state.
# - `maxmemory 100mb` keeps Redis below the 128Mi container limit so the kernel
#   OOM killer does not drop every in-flight lock and queue entry. Alert on
#   redis_memory_used_bytes / redis_memory_max_bytes > 0.8.
# - `appendonly yes` gives AOF durability for locks, queues and revocations.
#
# `requirepass` is intentionally NOT set here: it is injected from the
# `stellaredupay-secrets` Secret (key REDIS_PASSWORD) via the
# REDIS_PASSWORD environment variable and `--requirepass` on the command line,
# so the credential never lands in a ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
data:
  redis.conf: |
    appendonly yes
    maxmemory 100mb
    maxmemory-policy noeviction
    # TLS is not enabled: traffic is plaintext inside the cluster and is
    # protected by the NetworkPolicy restricting access to the backend and
    # worker pods. Revisit if Redis is ever reached across namespaces.
