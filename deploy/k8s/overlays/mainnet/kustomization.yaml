apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production / mainnet overlay.
# Apply with: kubectl apply -k deploy/k8s/overlays/mainnet
#
# Image Promotion Workflow:
#
#   1. SHAs are validated in testnet first (see overlays/testnet/kustomization.yaml).
#
#   2. Once validated, promote the same SHA to mainnet by updating newTag below.
#      Promoting from testnet to mainnet is a one-line newTag change — reviewable in git.
#      Example: newTag: sha-abc1234  (same SHA from testnet)
#
#   3. Commit and deploy: kubectl apply -k deploy/k8s/overlays/mainnet
#
# Private Registry:
#
#   If using a private registry, uncomment imagePullSecrets and ensure the
#   secret exists in the cluster:
#
#     kubectl create secret docker-registry regcred \
#       --docker-server=your.registry.com \
#       --docker-username=<username> \
#       --docker-password=<password>

resources:
  - ../../

images:
  - name: stellaredupay/backend
    newTag: sha-PLACEHOLDER
  - name: stellaredupay/frontend
    newTag: sha-PLACEHOLDER

# Uncomment for private registries:
# imagePullSecrets:
#   - name: regcred

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                env:
                  - name: STELLAR_NETWORK
                    value: "mainnet"
    target:
      kind: Deployment
      name: backend
