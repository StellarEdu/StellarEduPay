apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      initContainers:
        - name: migrate
          image: stellaredupay/backend:canary
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: stellaredupay
                  key: MONGO_URI
      containers:
        - name: backend
          image: stellaredupay/backend:canary
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
