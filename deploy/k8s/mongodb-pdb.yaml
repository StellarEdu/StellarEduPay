apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  # mongodb-statefulset.yaml runs a 3-member replica set (1 primary, 2 secondaries).
  # The readiness probe accepts both PRIMARY and SECONDARY members, so all three
  # pods count as available. Allow one member to be evicted at a time (node drain,
  # cluster autoscaler scale-down, managed-cluster upgrade) while keeping a
  # majority (2 of 3) available so the replica set retains quorum and routine
  # maintenance can never take the payment database offline.
  minAvailable: 2
  selector:
    matchLabels:
      app: mongodb