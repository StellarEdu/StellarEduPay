apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  serviceName: mongodb
  replicas: 3
  # Parallel: all three pods are created at once. With the default
  # OrderedReady, mongodb-1 is not created until mongodb-0 is Ready, but
  # mongodb-0 cannot become primary until mongodb-1/2 exist — a deadlock.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          # ── Single-node replica set ("rs0") — REQUIRED ─────────────────────
          # Multi-document MongoDB transactions are used by the payment
          # pipeline, fee batch operations and TransactionManager; a standalone
          # mongod rejects every startTransaction() with "Transaction numbers
          # are only allowed on a replica set member or mongos".
          # --bind_ip_all is also required: mongod's default localhost-only
          # bind would make the headless Service unreachable from other pods.
          command:
            - mongod
            - --replSet
            - rs0
            - --bind_ip_all
          # rs.initiate() is NOT run here: a per-pod postStart hook fires
          # before the peer pods' DNS records exist, so initiation fails and
          # the hook loops/aborts. The replica set is initiated once by the
          # mongodb-init Job below, after all three members resolve.
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: stellaredupay
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          # READY means mongod answers ping AND is a replica-set member in
          # state PRIMARY (1) or SECONDARY (2). Requiring PRIMARY would keep
          # secondaries permanently NotReady, which blocks rolling updates
          # and keeps them out of Service endpoints.
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - |
                  db.adminCommand({ ping: 1 });
                  const state = rs.status().myState;
                  if (state !== 1 && state !== 2) {
                    throw new Error("replica set member not PRIMARY/SECONDARY: " + state);
                  }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand({ping:1})"
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 30Gi
---
# Headless service for stable pod DNS (mongodb-0.mongodb.<namespace>.svc.cluster.local).
# The pods run a replica set ("rs0") because multi-document transactions require one —
# see docs/architecture.md "Replica Set Requirement".
# MONGO_URI in the stellaredupay Secret MUST therefore include the replica set:
#   mongodb://mongodb-0.mongodb.<namespace>.svc.cluster.local:27017/stellaredupay?replicaSet=rs0
# Or, to use MongoDB Atlas or another external managed service instead, omit
# this StatefulSet and point MONGO_URI at the Atlas connection string.
#
# NOTE: This is the production-ready 3-node replica set for high availability.
# For development and testing only, create a kustomization overlay that sets
# replicas: 1 to reduce resource consumption. A single-replica StatefulSet
# provides no failover protection but satisfies the transaction requirement.
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: mongodb
spec:
  clusterIP: None
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
---
# One-shot replica-set initiation. Waits until all three members' DNS records
# resolve, then calls rs.initiate() idempotently (AlreadyInitialized is
# treated as success). Safe to re-run; the Job is deleted/recreated by
# `kubectl apply -k` only when its spec changes.
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init
  labels:
    app: mongodb
    app.kubernetes.io/component: replica-set-init
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: mongodb
        app.kubernetes.io/component: replica-set-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:7
          command:
            - /bin/bash
            - -ec
            - |
              # Wait for every member's DNS record to resolve.
              for host in mongodb-0.mongodb mongodb-1.mongodb mongodb-2.mongodb; do
                for i in $(seq 1 60); do
                  if getent hosts "$host" >/dev/null 2>&1; then
                    break
                  fi
                  if [ "$i" -eq 60 ]; then
                    echo "timed out waiting for DNS: $host" >&2
                    exit 1
                  fi
                  sleep 2
                done
              done

              # Wait for mongodb-0 to accept connections.
              for i in $(seq 1 60); do
                if mongosh --quiet --host mongodb-0.mongodb --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1; then
                  break
                fi
                if [ "$i" -eq 60 ]; then
                  echo "timed out waiting for mongodb-0" >&2
                  exit 1
                fi
                sleep 2
              done

              # Initiate idempotently; AlreadyInitialized is success.
              mongosh --quiet --host mongodb-0.mongodb --eval '
                try {
                  rs.initiate({
                    _id: "rs0",
                    members: [
                      { _id: 0, host: "mongodb-0.mongodb:27017" },
                      { _id: 1, host: "mongodb-1.mongodb:27017" },
                      { _id: 2, host: "mongodb-2.mongodb:27017" }
                    ]
                  });
                } catch (e) {
                  if (e.codeName === "AlreadyInitialized" || /already initialized/i.test(e.message)) {
                    print("replica set already initialized");
                  } else {
                    throw e;
                  }
                }
              '
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
