apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base manifest set — not intended to be applied directly.
# Select an environment overlay instead:
#
#   kubectl apply -k deploy/k8s/overlays/mainnet   # production
#   kubectl apply -k deploy/k8s/overlays/testnet   # staging / testnet
#
# Image Tags and Private Registry:
#
#   Image tags are set to "placeholder" in the base manifests to prevent
#   accidental use. Use Kustomize overlays to override image tags with
#   immutable commit SHAs from your CI pipeline:
#
#     images:
#       - name: ghcr.io/stellaredu/stellaredupay-backend
#         newTag: sha-abc1234
#
#   For private registries, add imagePullSecrets to the overlay:
#
#     imagePullSecrets:
#       - name: regcred
#
#   (Create the secret with: kubectl create secret docker-registry regcred \
#    --docker-server=<registry> --docker-username=<user> --docker-password=<pass>)

resources:
  - policies/verify-stellaredupay-images.yaml
  - backend-deployment.yaml
  - backend-hpa.yaml
  - backend-pdb.yaml
  - mongodb-pdb.yaml
  - backend-networkpolicy.yaml
  - mongodb-networkpolicy.yaml
  - redis-networkpolicy.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - redis.yaml
  - mongodb-statefulset.yaml
  - configmap.yaml
  - ingress.yaml
  - backup-cronjob.yaml

# Single source of truth for the Ingress host (issue #2005).
# INGRESS_HOST from the `stellaredupay-ingress-host` ConfigMap is copied into
# both spec.tls[0].hosts and spec.rules[0].host, so the TLS certificate and the
# routing rule always name the same host. Override the ConfigMap value in an
# overlay to deploy a different domain.
replacements:
  - source:
      kind: ConfigMap
      name: stellaredupay-ingress-host
      fieldPath: data.INGRESS_HOST
    targets:
      - select:
          kind: Ingress
          name: stellaredupay
        fieldPaths:
          - spec.tls.0.hosts.0
          - spec.rules.0.host
