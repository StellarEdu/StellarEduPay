version: '3.8'

services:
  backend:
    build: ./backend
    # Apply pending database migrations before starting the server. `npm run
    # migrate` exits non-zero on failure, so the container will not start (and
    # therefore never becomes healthy) if a migration fails.
    command: ["sh", "-c", "npm run migrate && npm start"]
    ports:
      - "${PORT:-5000}:5000"
    environment:
      # MONGO_ROOT_USERNAME and MONGO_ROOT_PASSWORD have no defaults — docker
      # compose up will fail loudly with a clear error if they are not set,
      # rather than silently starting with well-known default credentials.
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME must be set}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}@mongo:27017/stellaredupay?authSource=admin&replicaSet=rs0
      - STELLAR_NETWORK=${STELLAR_NETWORK}
      - SCHOOL_WALLET_ADDRESS=${SCHOOL_WALLET_ADDRESS}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_OPTIONS=--max-old-space-size=400
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=8h
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # BACKUP_NOTIFY_TOKEN — shared secret used by backup.sh to authenticate
      # the POST /api/internal/backup-heartbeat call. Must be the same value
      # set in the backup service. See issue #1102.
      - BACKUP_NOTIFY_TOKEN=${BACKUP_NOTIFY_TOKEN:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend-backend
      - backend-db
    mem_limit: ${BACKEND_MEM_LIMIT:-512m}
    memswap_limit: ${BACKEND_MEM_LIMIT:-512m}
    cpus: ${BACKEND_CPUS:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # The process-level error handlers (src/errorHandling.js) deliberately
    # process.exit(1) on an unhandled rejection or uncaught exception (see
    # docs/error-handling.md). Without a restart policy, a crash here was a
    # permanent, all-tenants outage requiring manual intervention — this was
    # previously unset. See docs/error-handling.md "Recovery Time & Blast
    # Radius" for the measured/expected recovery time this now provides.
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* vars are inlined at build time by Next.js — pass as build arg
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
        NEXT_PUBLIC_STELLAR_NETWORK: ${STELLAR_NETWORK:-testnet}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-backend
    mem_limit: ${FRONTEND_MEM_LIMIT:-256m}
    cpus: ${FRONTEND_CPUS:-0.5}
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - backend-db
    mem_limit: ${REDIS_MEM_LIMIT:-128m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mongo:
    image: mongo:7
    # ── Single-node replica set ("rs0") — REQUIRED, not optional ──────────────
    # Multi-document MongoDB transactions are used by the payment pipeline
    # (transactionPollingService.processTransaction), fee batch operations
    # (feeController, feeAdjustmentController) and TransactionManager. A
    # standalone mongod rejects every startTransaction() with:
    #   "Transaction numbers are only allowed on a replica set member or mongos"
    # so a replica set is an infrastructure requirement — see
    # docs/architecture.md "Replica Set Requirement".
    #
    # --keyFile enables both intra-cluster auth and client authentication; the
    # official entrypoint strips it (and --replSet) during its one-shot init
    # phase that creates the root user from MONGO_INITDB_* below, then restarts
    # with the full flags. The keyfile is generated at first boot and is never
    # committed to the repository.
    entrypoint:
      - /bin/bash
      - -ec
      - |
        mkdir -p /etc/mongodb
        if [ ! -f /etc/mongodb/keyfile ]; then
          openssl rand -base64 756 > /etc/mongodb/keyfile
          chmod 400 /etc/mongodb/keyfile
          chown mongodb:mongodb /etc/mongodb/keyfile
        fi
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /etc/mongodb/keyfile --bind_ip_all
    # MongoDB port is NOT exposed to the host by default. The backend reaches
    # it over the internal backend-db network. To access MongoDB from the host
    # for local debugging only, override this in a docker-compose.override.yml:
    #   services:
    #     mongo:
    #       ports:
    #         - "127.0.0.1:27017:27017"
    environment:
      # No defaults — must be explicitly set. See MONGO_ROOT_USERNAME /
      # MONGO_ROOT_PASSWORD in .env.example.
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME must be set}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}
    volumes:
      - mongo_data:/data/db
    networks:
      - backend-db
    mem_limit: ${MONGO_MEM_LIMIT:-1g}
    cpus: ${MONGO_CPUS:-1.0}
    # Healthy only once rs0 is initiated AND this member is PRIMARY. The first
    # probe performs rs.initiate(); subsequent probes flip healthy once the
    # single-node election completes (~seconds). dependents (backend, backup)
    # wait on service_healthy, so they never start against a non-primary node.
    healthcheck:
      test: |
        mongosh -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --quiet --eval "
          var status;
          try {
            status = rs.status();
          } catch (e) {
            try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }); } catch (e2) {}
            quit(1);
          }
          if (status.ok !== 1 || !db.hello().isWritablePrimary) { quit(1); }
        "
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  # Runs scripts/backup.sh every 24 hours and retains RETAIN_DAYS of backups.
  # Backups are written to the host path defined by BACKUP_DIR (default: ./backups).
  #
  # This deliberately invokes the SAME verified scripts/backup.sh used for
  # manual/CI backups rather than a raw mongodump call, so the compose-embedded
  # path carries identical integrity guarantees (minimum-size check +
  # mongorestore --dryRun verification + retention pruning). See issue #1106 —
  # there is now a single, well-verified backup implementation, not two.
  backup:
    image: mongo:7
    entrypoint: >
      /bin/bash -c '
        while true; do
          echo "[backup] $(date -u) — starting backup";
          bash /scripts/backup.sh || echo "[backup] FAILED";
          sleep 86400;
        done
      '
    environment:
      # No defaults — must be explicitly set alongside the mongo service.
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME must be set}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}@mongo:27017/stellaredupay?authSource=admin&replicaSet=rs0
      - BACKUP_DIR=/backups
      - RETAIN_DAYS=${RETAIN_DAYS:-7}
      - MIN_BACKUP_SIZE=${MIN_BACKUP_SIZE:-1024}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      # BACKUP_NOTIFY_TOKEN — must match the backend's BACKUP_NOTIFY_TOKEN so
      # backup.sh can post a heartbeat that updates the backup staleness metric.
      # Without this the BackupNotRun/BackupStale Prometheus alerts will fire.
      - BACKUP_NOTIFY_TOKEN=${BACKUP_NOTIFY_TOKEN:-}
      - BACKEND_INTERNAL_URL=http://backend:5000
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts:/scripts:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - backend-db
    restart: unless-stopped

  # mongo-verify — disposable MongoDB instance used only to restore-test the
  # latest nightly backup. Never receives production traffic. See issue #1343.
  mongo-verify:
    image: mongo:7
    networks:
      - backend-db
    restart: unless-stopped

  # backup-verify — weekly job that restores the most recent backup archive
  # into mongo-verify (never into production) and compares document counts
  # against production, closing the gap where a corrupted backup would
  # otherwise only be discovered during an actual disaster recovery. See
  # issue #1343.
  backup-verify:
    image: mongo:7
    entrypoint: >
      /bin/bash -c '
        while true; do
          echo "[backup-verify] $(date -u) — starting weekly backup verification";
          bash /scripts/verify-latest-backup.sh || echo "[backup-verify] FAILED";
          sleep 604800;
        done
      '
    environment:
      - BACKUP_DIR=/backups
      - PROD_MONGO_URI=mongodb://${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME must be set}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}@mongo:27017/stellaredupay?authSource=admin&replicaSet=rs0
      - TEMP_MONGO_URI=mongodb://mongo-verify:27017/stellaredupay
      - BACKUP_NOTIFY_TOKEN=${BACKUP_NOTIFY_TOKEN:-}
      - BACKEND_INTERNAL_URL=http://backend:5000
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups:ro
      - ./scripts:/scripts:ro
    depends_on:
      mongo:
        condition: service_healthy
      mongo-verify:
        condition: service_started
    networks:
      - backend-db
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  frontend-backend:
    driver: bridge
  backend-db:
    driver: bridge
