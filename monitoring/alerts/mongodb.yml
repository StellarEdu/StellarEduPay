groups:
  - name: mongodb
    interval: 60s
    rules:
      # ── Critical: not connected to MongoDB ────────────────────────────────
      # mongodb_connection_state mirrors mongoose.connection.readyState
      # (1=connected) on every scrape. Every payment read/write depends on
      # this connection, so any sustained non-connected state is a full
      # outage of the payment-processing path, not a degradation.
      - alert: MongoDBDisconnected
        expr: mongodb_connection_state != 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MongoDB is not connected"
          description: >
            mongodb_connection_state has been away from "connected" (1) for
            over a minute (current value: {{ $value }}; 0=disconnected,
            2=connecting, 3=disconnecting). Payment reads and writes are
            failing. Check MongoDB Atlas/replica-set health and network
            connectivity from the backend.

      # ── Warning: driver reporting connection errors ───────────────────────
      # mongodb_connection_errors_total increments on every 'error' event from
      # the driver (config/database.js). The driver retries transparently for
      # many of these, so a low sustained rate is worth investigating before
      # it escalates into MongoDBDisconnected.
      - alert: MongoDBConnectionErrorsElevated
        expr: rate(mongodb_connection_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MongoDB connection errors are occurring"
          description: >
            The MongoDB driver has reported connection errors for 5 minutes
            ({{ $value | printf "%.3f" }}/s). The connection pool may be
            unstable even though mongodb_connection_state still reads
            "connected". Check application logs for "[MongoDB] Connection
            error" entries.

  - name: redis
    interval: 60s
    rules:
      # ── Warning: Redis memory approaching maxmemory ───────────────────────
      # Redis runs with maxmemory-policy noeviction (required by BullMQ: with
      # eviction, job keys silently disappear). That means once used memory
      # reaches maxmemory, Redis rejects all writes with OOM errors instead of
      # evicting keys — the BullMQ retry/dead-letter queues, distributed locks,
      # fencing counters, rate-limit counters, session revocations and
      # idempotency keys all stop being written. Alert well before the limit so
      # there is time to raise maxmemory or shed load.
      # Runbook: docs/runbooks/redis.md (sizing guide: keys per school and per
      # payment; raise maxmemory or scale out before the limit is hit).
      - alert: RedisMemoryUsageHigh
        expr: >
          redis_memory_used_bytes / redis_memory_max_bytes > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage is above 80% of maxmemory"
          description: >
            Redis is using {{ $value | humanizePercentage }} of its configured
            maxmemory (redis_memory_used_bytes / redis_memory_max_bytes) for
            over 10 minutes. Eviction is disabled (maxmemory-policy
            noeviction), so at maxmemory Redis will reject writes and the
            BullMQ queues, locks, rate-limit counters and idempotency keys will
            stop accepting writes. Raise maxmemory, review the sizing guide in
            docs/runbooks/redis.md, and check for unbounded key growth (e.g.
            fencing counters).
