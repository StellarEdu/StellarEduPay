global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts/price_feed.yml"
  - "alerts/horizon_poll.yml"
  - "alerts/payment_limits.yml"
  - "alerts/receipts.yml"
  - "alerts/webhook_alerts.yml"
  - "alerts/api_errors.yml"
  - "alerts/api_latency.yml"
  - "alerts/mongodb.yml"
  - "alerts/horizon_failover.yml"
  - "alerts/queue_backpressure.yml"
  - "alerts/backup.yml"
  - "alerts/transaction_queue.yml"
  - "alerts/leader_election.yml"

scrape_configs:
  - job_name: stellaredupay
    metrics_path: /metrics
    # Set METRICS_TOKEN in backend/.env, then substitute it here before deploying.
    # Generate a strong token with: openssl rand -hex 32
    # Replace the placeholder below with the actual token value.
    # Never use "change_me_to_a_secure_random_token" in any environment.
    authorization:
      type: Bearer
      credentials: "REPLACE_WITH_METRICS_TOKEN"
    static_configs:
      # host.docker.internal resolves to the Docker host on Mac/Windows.
      # On Linux it is mapped to host-gateway via extra_hosts in docker-compose.monitoring.yml.
      - targets:
          - "host.docker.internal:5000"

  # ── Infrastructure exporters ─────────────────────────────────────────────

  # MongoDB metrics via percona/mongodb_exporter
  # Covers: connection pool utilization, operation counters, replication lag,
  # document/index stats, and WiredTiger cache pressure.
  - job_name: mongodb
    static_configs:
      - targets:
          - "mongodb_exporter:9216"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "mongodb"

  # Redis metrics via oliver006/redis_exporter
  # Covers: memory usage & fragmentation, connected clients, evictions,
  # keyspace hit/miss ratio, and BullMQ queue key counts.
  - job_name: redis
    static_configs:
      - targets:
          - "redis_exporter:9121"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "redis"

  # Host/container metrics via node_exporter
  # Covers: CPU utilisation, memory pressure, disk I/O and free space,
  # and network throughput — essential for diagnosing resource exhaustion
  # during start-of-term payment spikes.
  - job_name: node
    static_configs:
      - targets:
          - "node_exporter:9100"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "docker-host"
