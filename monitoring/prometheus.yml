global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Glob so every rule file in monitoring/alerts/ is loaded. Listing files by
# hand silently dropped admin-alerts.yml, heap_usage.yml and
# payment_processing_latency.yml (#2016). scripts/check-prometheus-rules.js
# fails CI if a file in alerts/ is not matched by this glob.
rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: stellaredupay
    metrics_path: /metrics
    # Bearer token read from a mounted file, never written into this tracked
    # file (#2019). Create monitoring/secrets/metrics_token — see the usage
    # notes in docker-compose.monitoring.yml. Must match METRICS_BEARER_TOKEN.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      # Backend reached by service name on the shared frontend-backend network.
      - targets:
          - "backend:5000"

  # ── Infrastructure exporters ─────────────────────────────────────────────

  # MongoDB metrics via percona/mongodb_exporter
  # Covers: connection pool utilization, operation counters, replication lag,
  # document/index stats, and WiredTiger cache pressure.
  - job_name: mongodb
    static_configs:
      - targets:
          - "mongodb_exporter:9216"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "mongodb"

  # Redis metrics via oliver006/redis_exporter
  # Covers: memory usage & fragmentation, connected clients, evictions,
  # keyspace hit/miss ratio, and BullMQ queue key counts.
  - job_name: redis
    static_configs:
      - targets:
          - "redis_exporter:9121"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "redis"

  # Host/container metrics via node_exporter
  # Covers: CPU utilisation, memory pressure, disk I/O and free space,
  # and network throughput — essential for diagnosing resource exhaustion
  # during start-of-term payment spikes.
  - job_name: node
    static_configs:
      - targets:
          - "node_exporter:9100"
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "docker-host"
