name: Release

# #1634 — automated semantic-versioned releases.
#
# release-please reads conventional commit messages on main and keeps a
# "release PR" open that bumps the version in package.json (root, backend,
# frontend) and moves pending notes into CHANGELOG.md. Merging that PR tags
# vX.Y.Z and publishes a GitHub release with generated notes; the images job
# then publishes Docker images tagged with the version AND the commit SHA so
# operators can pin or roll back to a known release.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  images:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/stellaredupay-${{ matrix.component }}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          build-args: |
            APP_VERSION=${{ needs.release-please.outputs.version }}
            GIT_SHA=${{ steps.meta.outputs.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ needs.release-please.outputs.version }}
            ${{ steps.meta.outputs.image }}:${{ needs.release-please.outputs.tag_name }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
