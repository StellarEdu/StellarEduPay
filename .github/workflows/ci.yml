name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (boots + parses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check every tracked .js file
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r file; do
            if ! node --check "$file"; then
              echo "::error file=$file::node --check failed"
              fail=1
            fi
          done < <(git ls-files '*.js')
          exit "$fail"

      - name: Fail on truncated-file placeholders
        run: |
          if git grep -n -E "truncated [0-9]+ chars"; then
            echo "::error::Found truncated-file placeholder markers in tracked files"
            exit 1
          fi
          echo "No truncated-file placeholders found"

      - name: Boot backend app with dummy env (no DB)
        env:
          NODE_ENV: test
        run: |
          node -e "require('./backend/src/app')"

  lockfile-sync:
    name: Lockfile sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify root package-lock.json is in sync
        run: npm ci --dry-run

      - name: Verify frontend package-lock.json is in sync
        working-directory: frontend
        run: npm ci --dry-run

      - name: Verify backend package-lock.json is in sync
        working-directory: backend
        run: npm ci --dry-run

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Accessibility tests
        run: npm run test:a11y

      - name: Dependency audit
        run: npm audit --audit-level=high
