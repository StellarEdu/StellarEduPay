name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version-drift:
    name: Check dependency version drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Detect major-version mismatches
        run: node scripts/check-version-drift.js

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: |
            backend/node_modules
            frontend/node_modules
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci
      - run: cd backend && npm ci && cd ..
      - run: cd frontend && npm ci && cd ..
      - name: Audit root
        run: node scripts/check-dependency-audit.js .
      - name: Audit backend
        run: node scripts/check-dependency-audit.js backend
      - name: Audit frontend
        run: node scripts/check-dependency-audit.js frontend

  secret-scan:
    name: Scan example files for real-format secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Scan example files for secret material
        run: node scripts/scan-example-secrets.js

  secret-scan-repo:
    name: Scan repository for committed Stellar secret keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Scan tracked files for Stellar secret key material
        run: node scripts/scan-repo-secrets.js

  migrations:
    name: Validate migration numbering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/validate-migrations.js

  orphan-dirs:
    name: Check for stray duplicate directories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-orphan-dirs.js

  error-response-shape:
    name: Check 401/403 response shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-error-response-shape.js

  k8s-ingress-tls:
    name: Verify Kubernetes ingress has TLS configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check ingress TLS block exists
        run: |
          if ! grep -q "tls:" deploy/k8s/ingress.yaml; then
            echo "ERROR: TLS block not found in deploy/k8s/ingress.yaml"
            exit 1
          fi
          echo "TLS block found in ingress configuration"

  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-node-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-node-
      - name: Install backend dependencies
        run: cd backend && npm ci
      - name: Run ESLint (backend)
        run: cd backend && npx eslint src/ --max-warnings=0

  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Run next lint (frontend)
        run: cd frontend && npm run lint

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Build frontend (next build)
        run: cd frontend && npm run build

  test:
    runs-on: ubuntu-latest
    env:
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      MONGO_URI: mongodb://localhost:27017/stellaredupay_test?replicaSet=rs0
      JWT_SECRET: ci-test-jwt-secret-not-used-in-production
      SCHOOL_WALLET_ADDRESS: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --replSet rs0
          --health-cmd "mongosh --quiet --eval 'try { if (rs.status().ok !== 1) { throw new Error(\"rs not initiated\"); } } catch (e) { try { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"localhost:27017\" }] }); } catch (e2) {} process.exit(1); } if (!db.hello().isWritablePrimary) { process.exit(1); }'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: |
            backend/node_modules
            frontend/node_modules
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci
      - run: cd backend && npm ci && cd ..
      - run: cd frontend && npm ci && cd ..
      - name: Syntax check
        run: npm run check:syntax
      - name: Run migrations against CI MongoDB
        working-directory: backend
        run: npm run migrate
      - run: npm test

  backend-test:
    runs-on: ubuntu-latest
    env:
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      MONGO_URI: mongodb://localhost:27017/stellaredupay_test?replicaSet=rs0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-node-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-node-
      - name: Install backend dependencies
        run: cd backend && npm ci
      - name: Run backend tests
        run: cd backend && npm test

  # Test coverage enforcement
  coverage:
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs:
      - version-drift
      - audit
      - secret-scan
      - secret-scan-repo
      - migrations
      - orphan-dirs
      - error-response-shape
      - lint-backend
      - lint-frontend
      - build-frontend
      - test
      - backend-test
      - coverage
      - k8s-validate
      - prometheus-validate
    steps:
      - run: echo "All required checks passed."
    name: Test coverage report
    runs-on: ubuntu-latest
    env:
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      MONGO_URI: mongodb://localhost:27017/stellaredupay_test?replicaSet=rs0
      JWT_SECRET: ci-test-jwt-secret-not-used-in-production
      SCHOOL_WALLET_ADDRESS: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --replSet rs0
          --health-cmd "mongosh --quiet --eval 'try { if (rs.status().ok !== 1) { throw new Error(\"rs not initiated\"); } } catch (e) { try { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"localhost:27017\" }] }); } catch (e2) {} process.exit(1); } if (!db.hello().isWritablePrimary) { process.exit(1); }'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: actions/cache@v6
        with:
          path: |
            backend/node_modules
            frontend/node_modules
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - run: npm ci
      - run: cd backend && npm ci && cd ..
      - run: cd frontend && npm ci && cd ..

      - name: Backend coverage
        run: npm run coverage

      - name: Frontend coverage
        run: npm run coverage:frontend

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage/backend
          retention-days: 14

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: coverage/frontend
          retention-days: 14

  docker-build:
    name: Docker image build & smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            stellaredupay/backend:ci
            stellaredupay/backend:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.source=./backend
          sbom: true
          sbom-mode: auto
          provenance: true

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            stellaredupay/frontend:ci
            stellaredupay/frontend:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.source=./frontend
          sbom: true
          sbom-mode: auto
          provenance: true

      - name: Set immutable image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Tag images with commit SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag stellaredupay/backend:ci stellaredupay/backend:${{ steps.meta.outputs.tag }}
          docker tag stellaredupay/frontend:ci stellaredupay/frontend:${{ steps.meta.outputs.tag }}
          echo "Backend:  stellaredupay/backend:${{ steps.meta.outputs.tag }}"
          echo "Frontend: stellaredupay/frontend:${{ steps.meta.outputs.tag }}"

      - name: Smoke-test backend container
        run: |
          docker run -d \
            --name backend-ci \
            --network host \
            -e JWT_SECRET=ci-smoke-test-secret \
            -e MONGO_URI=mongodb://localhost:27017/stellaredupay_smoketest?replicaSet=rs0 \
            -e STELLAR_NETWORK=testnet \
            -e SCHOOL_WALLET_ADDRESS=GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5 \
            stellaredupay/backend:ci
          for i in $(seq 1 12); do
            if curl -sf http://localhost:5000/health/live; then
              echo ""
              echo "Backend is live"
              exit 0
            fi
            echo "Waiting for backend to start... ($i/12)"
            sleep 5
          done
          docker logs backend-ci
          echo "Backend failed to start within 60 seconds"
          exit 1

  docker-compose-smoke:
    name: Docker Compose stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether compose/env files changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}" -- docker-compose.yml docker-compose.monitoring.yml backend/Dockerfile frontend/Dockerfile .env.example || true)
          if [ -n "$CHANGED" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # Full docker-compose stack (Mongo replica set, Redis, backend, frontend)
      # brought up with `docker compose up --wait` so a breaking change to
      # docker-compose.yml -- a missing env var, a renamed depends_on service,
      # a broken init container -- fails CI instead of only surfacing on a
      # developer's machine or in staging. See issue #1418.
      - name: Bring up full stack
        if: steps.changes.outputs.run == 'true'
        env:
          MONGO_ROOT_USERNAME: ci_root
          MONGO_ROOT_PASSWORD: ci-compose-smoke-password
          JWT_SECRET: ci-compose-smoke-secret
          STELLAR_NETWORK: testnet
          SCHOOL_WALLET_ADDRESS: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
          ADMIN_USERNAME: ci_admin
          ADMIN_PASSWORD: ci-compose-smoke-admin-password
        run: docker compose up -d --wait --wait-timeout 180 backend frontend redis mongo

      - name: Verify backend /health is healthy
        if: steps.changes.outputs.run == 'true'
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
          if [ "$status" != "200" ]; then
            echo "Expected 200 ok from /health, got $status"
            docker compose logs
            exit 1
          fi
          echo "Backend /health returned 200 ok"

      - name: Tear down stack
        if: always() && steps.changes.outputs.run == 'true'
        run: docker compose down -v

  k8s-validate:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz -o /tmp/kubeconform.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp/
          cp /tmp/kubeconform /usr/local/bin/kubeconform
          chmod +x /usr/local/bin/kubeconform

      - name: Validate base manifests with kustomize and kubeconform
        run: |
          kustomize build deploy/k8s/overlays/mainnet | kubeconform -strict -summary
          kustomize build deploy/k8s/overlays/testnet | kubeconform -strict -summary

      - name: Validate k8s manifests with kubeconform strict
        run: |
          for overlay in mainnet testnet canary; do
            echo "Validating overlay: $overlay"
            kustomize build deploy/k8s/overlays/$overlay | kubeconform -strict -summary
          done

  prometheus-validate:
    name: Validate Prometheus rules and config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install promtool
        run: |
          curl -sL https://github.com/prometheus/prometheus/releases/download/v3.0.0/prometheus-3.0.0.linux-amd64.tar.gz -o /tmp/prometheus.tar.gz
          tar -xzf /tmp/prometheus.tar.gz -C /tmp/ --strip-components=1 prometheus/promtool
          cp /tmp/prometheus/promtool /usr/local/bin/promtool
          chmod +x /usr/local/bin/promtool

      - name: Check prometheus.yml config
        run: promtool check config monitoring/prometheus.yml

      - name: Check prometheus alert rules
        run: |
          for rule_file in monitoring/alerts/*.yml; do
            echo "Checking $rule_file"
            promtool check rules "$rule_file" --output json -- strict
          done

      - name: Check docker compose config
        run: docker compose -f docker-compose.yml config -q && docker compose -f docker-compose.monitoring.yml config -q

  test-e2e-ci:
    name: Run E2E tests in CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Bring up compose stack for E2E
        env:
          MONGO_ROOT_USERNAME: ci_root
          MONGO_ROOT_PASSWORD: ci-compose-smoke-password
          JWT_SECRET: ci-compose-smoke-secret
          STELLAR_NETWORK: testnet
          SCHOOL_WALLET_ADDRESS: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
        run: docker compose up -d --wait --wait-timeout 180 backend frontend redis mongo

      - name: Wait for backend to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/health/live; then
              echo "Backend is live"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 5
          done
          echo "Backend failed to start"
          exit 1

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Tear down compose stack
        if: always()
        run: docker compose down -v

  # Run integration tests nightly
  integration-nightly:
    name: Nightly integration tests
    runs-on: ubuntu-latest
    schedule:
      - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM
    steps:
      - uses: actions/checkout@v7

      - name: Run integration tests
        run: npm run test:integration
        env:
          STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
          MONGO_URI: mongodb://localhost:27017/stellaredupay_test?replicaSet=rs0
          JWT_SECRET: ci-test-jwt-secret-not-used-in-production
          SCHOOL_WALLET_ADDRESS: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
  # A single job that every branch-protection rule needs to require. Add this
  # job name ("CI gate") as the sole required status check in GitHub's branch
  # protection settings for `main`. It fans in `test` and `coverage` so that
  # a Jest coverage-threshold breach blocks the PR just like a test failure
  # does. Add any other must-pass jobs to the `needs` list here rather than
  # registering many individual required checks.
    name: CI gate
    runs-on: ubuntu-latest
    needs:
      - version-drift
      - audit
      - secret-scan
      - secret-scan-repo
      - migrations
      - orphan-dirs
      - error-response-shape
      - lint-backend
      - lint-frontend
      - build-frontend
      - test
      - backend-test
      - coverage
      - k8s-validate
      - prometheus-validate
    steps:
      - run: echo "All required checks passed."
