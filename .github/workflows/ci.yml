name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GitHub deprecated the Node.js 20 runtime for actions on 2026-06-16.
# This flag forces legacy Node.js 20 action runtimes to run under Node.js 24
# until the underlying actions publish native Node.js 24 releases.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── #1082 ──────────────────────────────────────────────────────────────────
  # Fails the build if any shared dependency's declared major version differs
  # between the root package.json and any workspace (backend / frontend).
  version-drift:
    name: Check dependency version drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Detect major-version mismatches
        run: node scripts/check-version-drift.js

  # ── Dependency security audits ─────────────────────────────────────────────
  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: actions/cache@v6
        with:
          path: |
            backend/node_modules
            frontend/node_modules
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - run: npm ci
      - run: cd backend && npm ci && cd ..
      - run: cd frontend && npm ci && cd ..

      # Fails on any high/critical advisory that has no current, non-expired
      # entry in security-exceptions.json. See docs/dependency-triage.md.
      - name: Audit root
        run: node scripts/check-dependency-audit.js .

      - name: Audit backend
        run: node scripts/check-dependency-audit.js backend

      - name: Audit frontend
        run: node scripts/check-dependency-audit.js frontend

  secret-scan:
    name: Scan example files for real-format secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      # Scans all .env.example / .env.local.example files for Stellar StrKey
      # secrets, BIP-39 mnemonics, and realistic hex values that should never
      # appear in committed template files. No dependencies required — pure Node.
      - name: Scan example files for secret material
        run: node scripts/scan-example-secrets.js

  migrations:
    name: Validate migration numbering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/validate-migrations.js

  # ── #1083: Lint gate ────────────────────────────────────────────────────────
  # Runs ESLint over backend source. A PR introducing a lint violation fails CI
  # before merge. Requires branch protection to mark this job as required.
  lint-backend:
    name: Lint backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: actions/cache@v6
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-node-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-node-

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Run ESLint (backend)
        run: cd backend && npx eslint src/ --max-warnings=0

  # ── #1083: Lint gate ────────────────────────────────────────────────────────
  # Runs next lint over the frontend source. A PR introducing a lint violation
  # fails CI before merge. Requires branch protection to mark this job as required.
  lint-frontend:
    name: Lint frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run next lint (frontend)
        run: cd frontend && npm run lint

  # ── #1081: Frontend build gate ─────────────────────────────────────────────
  # Runs next build so that any commit introducing a broken import, a JSX syntax
  # error, or a Next.js build-time error fails CI rather than blocking a deploy.
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    env:
      # next build requires NEXT_PUBLIC_* vars to be present at build time even
      # if they resolve to a placeholder value in CI.
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend (next build)
        run: cd frontend && npm run build

  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    env:
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      # Tests mock Mongoose — a standalone instance is sufficient for unit tests.
      # Integration tests that require a replica set are guarded by RUN_INTEGRATION_TESTS.
      MONGO_URI: mongodb://localhost:27017/stellaredupay_test
      # Dummy secrets required by config/index.js validation before test files can set them.
      JWT_SECRET: ci-test-jwt-secret-not-used-in-production
      SCHOOL_WALLET_ADDRESS: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - uses: actions/cache@v6
        with:
          path: |
            backend/node_modules
            frontend/node_modules
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - run: npm ci

      - run: cd backend && npm ci && cd ..

      - run: cd frontend && npm ci && cd ..

      # Syntax gate — walks backend/src (node --check) and frontend/src
      # (@babel/core parseSync for JSX) with a pure-Node recursive fs walk:
      # no glob dependency required.
      # Exit codes are distinct so a red step is unambiguous:
      #   0 = clean · 1 = syntax error detected (names file:line)
      #   2 = the gate itself failed to run (missing dep/dir, zero files)
      - name: Syntax check
        run: npm run check:syntax

      - name: Run migrations against CI MongoDB
        working-directory: backend
        run: npm run migrate

      - run: npm test

  docker-build:
    name: Docker image build & smoke test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t stellaredupay/backend:ci ./backend

      - name: Smoke-test backend container
        run: |
          docker run -d \
            --name backend-ci \
            --network host \
            -e JWT_SECRET=ci-smoke-test-secret \
            -e MONGO_URI=mongodb://localhost:27017/stellaredupay_smoketest \
            -e STELLAR_NETWORK=testnet \
            -e SCHOOL_WALLET_ADDRESS=GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5 \
            stellaredupay/backend:ci
          for i in $(seq 1 12); do
            if curl -sf http://localhost:5000/health/live; then
              echo ""
              echo "Backend is live"
              exit 0
            fi
            echo "Waiting for backend to start... ($i/12)"
            sleep 5
          done
          docker logs backend-ci
          echo "Backend failed to start within 60 seconds"
          exit 1

      - name: Build frontend image
        run: docker build -t stellaredupay/frontend:ci ./frontend
