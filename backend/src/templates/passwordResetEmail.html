<!DOCTYPE html>
<html lang="{{i18n_lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{i18n_passwordReset_title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f4;font-family:Arial,Helvetica,sans-serif;color:#333333;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:8px;overflow:hidden;">
          <tr>
            <td style="padding:32px 32px 16px 32px;">
              <h1 style="margin:0 0 16px 0;font-size:22px;line-height:28px;color:#1a1a1a;">{{i18n_passwordReset_heading}}</h1>
              <p style="margin:0 0 16px 0;font-size:15px;line-height:22px;">{{i18n_passwordReset_greeting}}</p>
              <p style="margin:0 0 24px 0;font-size:15px;line-height:22px;">{{i18n_passwordReset_intro}}</p>
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px 0;">
                <tr>
                  <td align="center" style="border-radius:6px;background-color:#2563eb;">
                    <a href="{{link}}" style="display:inline-block;padding:12px 24px;font-size:15px;font-weight:bold;color:#ffffff;text-decoration:none;border-radius:6px;">{{i18n_passwordReset_button}}</a>
                  </td>
                </tr>
              </table>
              <p style="margin:0 0 16px 0;font-size:14px;line-height:20px;color:#555555;">{{i18n_passwordReset_linkFallback}}</p>
              <p style="margin:0 0 24px 0;font-size:13px;line-height:20px;color:#555555;word-break:break-all;">
                <a href="{{link}}" style="color:#2563eb;text-decoration:underline;">{{link}}</a>
              </p>
              <p style="margin:0 0 16px 0;font-size:14px;line-height:20px;color:#555555;">{{i18n_passwordReset_expiry}}</p>
              <p style="margin:0 0 0 0;font-size:14px;line-height:20px;color:#555555;">{{i18n_passwordReset_ignore}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 32px 32px;border-top:1px solid #e5e5e5;">
              <p style="margin:0;font-size:12px;line-height:18px;color:#888888;">{{i18n_passwordReset_footer}}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
