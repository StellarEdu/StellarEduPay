version: "3.8"

# Local development monitoring stack — Prometheus + Grafana + exporters.
#
# Prerequisites:
#   The main stack (docker-compose.yml) must be running first. This file joins
#   its networks as external networks so exporters and Prometheus can reach
#   mongo, redis and backend by service name (#2019).
#
# Usage:
#   1. Create the metrics scrape token file (NOT committed; git-ignored):
#        openssl rand -hex 32 > monitoring/secrets/metrics_token
#        chmod 600 monitoring/secrets/metrics_token
#      Use the same value as METRICS_BEARER_TOKEN in backend/.env.
#   2. Set GRAFANA_PASSWORD to a strong password (required — no default):
#        export GRAFANA_PASSWORD=$(openssl rand -hex 24)
#   3. Set MONGO_EXPORTER_URI to a least-privilege monitoring user, e.g.
#        mongodb://metrics:<password>@mongo:27017/?authSource=admin&replicaSet=rs0
#      (the user needs the clusterMonitor role; required — no default).
#   4. docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# All published ports are bound to 127.0.0.1 only. Reach them from the host
# itself, or put a reverse proxy with authentication in front of them.
#
# Prometheus: http://127.0.0.1:9090
# Grafana:    http://127.0.0.1:3001  (admin / <GRAFANA_PASSWORD>)
# Jaeger UI:  http://127.0.0.1:16686 (traces — see docs/tracing.md, #1636)

services:
  prometheus:
    image: prom/prometheus:v2.51.2
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts:/etc/prometheus/alerts:ro
      - ./monitoring/secrets/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    # --web.enable-lifecycle intentionally omitted: it allowed unauthenticated
    # POST /-/quit and /-/reload (#2019).
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
      - frontend-backend
    restart: unless-stopped

  # Alertmanager receives firing alerts from Prometheus and routes them to
  # PagerDuty / Slack / the Watchdog heartbeat (#2018). Receiver secrets are
  # read from ./monitoring/secrets/ — see monitoring/secrets/README.md.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Error: GRAFANA_PASSWORD environment variable must be set. Generate one with: openssl rand -hex 24}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3001"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring
    restart: unless-stopped

  # ── Distributed tracing (#1636) ─────────────────────────────────────────
  # Jaeger all-in-one receives OTLP traces from the backend. Enable tracing in
  # the backend with OTEL_TRACING_ENABLED=true and
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 (see docs/tracing.md).
  # In-memory storage — traces are lost on restart; use Tempo/Jaeger with a
  # persistent backend in production.
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686" # UI
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    networks:
      - monitoring
    restart: unless-stopped

  # ── Infrastructure exporters ──────────────────────────────────────────────

  # Exports MongoDB metrics (connection pool, op counters, replication lag, etc.)
  # Uses the percona/mongodb_exporter image which supports MongoDB 5+/6+/7+.
  mongodb_exporter:
    image: percona/mongodb_exporter:0.40
    command:
      - "--mongodb.uri=${MONGO_EXPORTER_URI:?Error: MONGO_EXPORTER_URI must be set to a least-privilege monitoring user (clusterMonitor role).}"
      - "--collect-all"
      - "--compatible-mode"
    ports:
      - "127.0.0.1:9216:9216"
    networks:
      - monitoring
      - backend-db
    restart: unless-stopped

  # Exports Redis metrics (memory usage, connected clients, hit/miss ratios, etc.)
  redis_exporter:
    image: oliver006/redis_exporter:v1.59.0
    environment:
      REDIS_ADDR: "redis://redis:6379"
      # Same password the redis service requires (set in .env).
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    ports:
      - "127.0.0.1:9121:9121"
    networks:
      - monitoring
      - backend-db
    restart: unless-stopped

  # Exports host/container-level metrics (CPU, memory, disk, network I/O).
  # Requires access to host proc/sys filesystems — run in read-only mode.
  node_exporter:
    image: prom/node-exporter:v1.7.0
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - monitoring
    restart: unless-stopped

networks:
  monitoring:
    driver: bridge
  # Networks created by the main stack (docker-compose.yml).
  frontend-backend:
    external: true
    name: stellaredupay_frontend-backend
  backend-db:
    external: true
    name: stellaredupay_backend-db

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
